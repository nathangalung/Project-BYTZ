name: kerjacus

services:
  # --- Infrastructure ---
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kerjacus
      POSTGRES_PASSWORD: kerjacus
      POSTGRES_DB: kerjacus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kerjacus"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgresql://kerjacus:kerjacus@postgres:5432/kerjacus
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: plain
      CLIENT_TLS_SSLMODE: disable
      SERVER_TLS_SSLMODE: disable
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # Valkey, not Redis: redis:7-alpine resolves to 7.4.x, which ships under
  # RSALv2/SSPLv1 rather than an OSI licence. Valkey is the BSD-3, Linux
  # Foundation fork and speaks the same RESP protocol, so redis/go-redis and
  # the redis:// URL scheme are unchanged. The image ships a redis-cli symlink,
  # so the healthcheck below works as-is.
  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- API Gateway ---
  traefik:
    image: traefik:v3.6
    ports:
      - "80:80"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./apps/gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./apps/gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - valkey
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- AI / LLM ---
  tensorzero:
    image: tensorzero/gateway:latest
    command: ["--config-file", "/etc/tensorzero/tensorzero.toml"]
    ports:
      - "3333:3333"
    volumes:
      - ./apps/gateway/tensorzero.toml:/etc/tensorzero/tensorzero.toml:ro
    environment:
      GOOGLE_AI_STUDIO_API_KEY: ${LLM_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3333/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Real-time Transport ---
  centrifugo:
    image: centrifugo/centrifugo:v6.9.1
    command: centrifugo -c /centrifugo/config.json
    ports:
      - "8000:8000"
    volumes:
      - ./apps/gateway/centrifugo.json:/centrifugo/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Workflow Orchestration ---
  temporal-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      # The image only ships config/dynamicconfig/docker.yaml; the previous
      # development-sql.yaml path does not exist and made temporal exit 1.
      # Mount our own file, same as docker-compose.prod.yml does.
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamic-config.yaml
    volumes:
      - ./apps/gateway/temporal-dynamic-config.yaml:/etc/temporal/dynamic-config.yaml:ro
    ports:
      - "7233:7233"
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      # Explicit --address: temporal binds the container IP, not loopback, so
      # the CLI default of 127.0.0.1:7233 is always refused.
      test:
        ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  # LLM observability: removed. langfuse:latest is v3, which mandates
  # Postgres + ClickHouse + Redis + S3 plus a separate langfuse-worker
  # container - six containers against an official 16 GiB minimum. TensorZero
  # already collects inference data into our own database at zero extra cost.

  # --- Monitoring (opt-in: --profile monitoring) ---
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    ports:
      - "3399:3001"
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3001'', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"',
        ]
      interval: 15s
      timeout: 10s
      retries: 3

  # --- Feature Flags (opt-in: --profile flags) ---
  flagsmith-db:
    image: postgres:17-alpine
    profiles: ["flags"]
    environment:
      POSTGRES_USER: flagsmith
      POSTGRES_PASSWORD: flagsmith
      POSTGRES_DB: flagsmith
    volumes:
      - flagsmith_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagsmith"]
      interval: 5s
      timeout: 5s
      retries: 5

  flagsmith:
    image: flagsmith/flagsmith:latest
    profiles: ["flags"]
    environment:
      DATABASE_URL: postgresql://flagsmith:flagsmith@flagsmith-db:5432/flagsmith
      DJANGO_ALLOWED_HOSTS: "*"
      ALLOW_ADMIN_INITIATION_VIA_CLI: "true"
      FLAGSMITH_DOMAIN: localhost:8002
      ENV: dev
    ports:
      - "8002:8000"
    depends_on:
      flagsmith-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- Observability (opt-in: --profile observability) ---
  #
  # OpenObserve replaces the SigNoz + ClickHouse + collector + query-service
  # stack that CLAUDE.md never specified. One Rust binary, ~260 MB resident,
  # unified logs/metrics/traces, OTLP-native on both gRPC and HTTP. SigNoz's
  # leanest current topology is five always-on containers with an official
  # 4 GB floor, and it dragged in a ClickHouse pin carrying two unpatched
  # HIGH-severity RCE CVEs (CVE-2024-6873, CVE-2025-1385).
  openobserve:
    image: openobserve/openobserve:v0.91.2
    profiles: ["observability"]
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:-root@kerjacus.id}
      # Must satisfy OpenObserve's own policy: 8-128 chars with upper, lower,
      # digit and symbol, else it panics at startup rather than warning.
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:-KerjaCus#Dev1}
      ZO_DATA_DIR: /data
      # Both caches size from HOST resources, not the cgroup limit. Measured on
      # this box: defaults gave 6.85 GB memory cache and a 397 GB disk cache.
      ZO_MEMORY_CACHE_MAX_SIZE: "256"
      ZO_DISK_CACHE_MAX_SIZE: "2048"
      # ZO_TELEMETRY, not ZO_TELEMETRY_ENABLED - the latter is silently ignored
      # and the container carries on phoning home.
      ZO_TELEMETRY: "false"
    volumes:
      - openobserve_data:/data
    ports:
      - "5080:5080" # UI + OTLP/HTTP ingest
      - "5081:5081" # OTLP/gRPC ingest
    # No healthcheck on purpose. The image is distroless - it contains only the
    # openobserve binary, with no shell, curl, wget or nc - and the binary has
    # no health subcommand, so no in-container probe can succeed. A permanently
    # red healthcheck on a working service is worse than none. Probe it
    # externally instead: curl -sf http://localhost:5080/healthz

volumes:
  postgres_data:
  valkey_data:
  nats_data:
  minio_data:
  openobserve_data:
  temporal_db_data:
  uptime_kuma_data:
  flagsmith_db_data:
