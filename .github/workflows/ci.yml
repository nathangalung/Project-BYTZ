name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Biome check
        run: bun run check

      - name: TypeScript type check
        run: bun run typecheck

      # payment-service validates every escrow release against a Go copy of the
      # fee table. The copy is generated from packages/shared/src/pricing.ts, so
      # editing the rates without regenerating would leave the service enforcing
      # a margin the platform no longer charges. Runs here rather than in
      # test-go because the generator imports the TypeScript and needs Bun.
      - name: Pricing table drift check
        run: bun run apps/payment-service/scripts/generate-pricing.ts --check

      # The three Go services each carry a copy of the same OTLP wiring and
      # trace-context helpers. A shared module is not reachable from inside
      # their Docker build contexts, so the copies are generated instead.
      # admin-service's had already drifted before this check existed.
      - name: Go observability drift check
        run: bun run packages/go-observability/generate.ts --check

      # The layering in CLAUDE.md was prose until now, so nothing stopped a
      # route reaching past its repository or a service importing a route. The
      # seventeen existing route-to-db importers are named in the config rather
      # than waved through, so the eighteenth fails here.
      - name: Architecture conformance
        run: bun run arch

      # Biome covers TypeScript only. Three Go services drifted out of gofmt
      # without anything noticing, which is what happens when near-identical
      # trees are maintained separately.
      - name: Go formatting
        run: |
          unformatted=$(gofmt -l apps/*/internal apps/*/features apps/*/main.go packages/go-observability)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

  test-unit:
    name: Unit & Integration Tests (TypeScript)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bytz_test
          POSTGRES_PASSWORD: bytz_test
          POSTGRES_DB: bytz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bytz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Valkey, matching docker-compose and prod. redis:7-alpine resolves to
      # 7.4.x under RSALv2/SSPLv1; the code targets the BSD-3 Valkey fork.
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # packages/db/src/testing.integration.test.ts hardcodes two database
      # names. It needs one of its own because project-service runs at the
      # same time under turbo and the harness truncates every table, and it
      # needs an unmigrated one to exercise the early return in truncateAll
      # (TRUNCATE with an empty table list is a syntax error, not a no-op).
      # The service container above creates only POSTGRES_DB, so without this
      # both suites fail on "database does not exist". Locally the equivalent
      # is `bun run db:test:setup`, which cannot run here: it starts Postgres
      # through docker compose, and here Postgres is a service container.
      - name: Create the auxiliary test databases
        env:
          PGPASSWORD: bytz_test
        run: |
          for n in kerjacus_dbself_test kerjacus_empty_test; do
            psql -h localhost -U bytz_test -d bytz_test -c "CREATE DATABASE $n"
          done

      - name: Run tests (verbose + coverage)
        # Two separators: bun run consumes the first, turbo needs the
        # second to know these belong to vitest and not to itself.
        run: bun run test:coverage -- -- --reporter verbose --reporter default
        env:
          DATABASE_URL: postgresql://bytz_test:bytz_test@localhost:5432/bytz_test
          DATABASE_DIRECT_URL: postgresql://bytz_test:bytz_test@localhost:5432/bytz_test
          # Integration suites connect here and run the migrations themselves.
          # The service above was provisioned from the start and nothing used
          # it, which is why repository and transaction tests were written as
          # regex over source text. The harness refuses any database whose name
          # does not end in _test, because it truncates every table.
          TEST_DATABASE_URL: postgresql://bytz_test:bytz_test@localhost:5432/bytz_test
          REDIS_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222
          BETTER_AUTH_SECRET: test-secret-minimum-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          NODE_ENV: test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ts-coverage-reports
          path: |
            packages/*/coverage/
            apps/*/coverage/
          retention-days: 14

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: apps/*/go.sum

      # `go test` runs a handful of vet analyzers itself - printf, atomic,
      # errorsas and a few more - but not the rest. The ones it skips are where
      # a stale call signature surfaces, so vet runs in full here, and first:
      # it is seconds against minutes of tests, and the tests will not compile
      # past the errors it reports anyway.
      - name: Payment Service Tests
        working-directory: apps/payment-service
        run: |
          go vet ./...
          go test -v ./... -coverprofile=coverage.out -count=1
          echo "--- Coverage Summary: payment-service ---"
          go tool cover -func=coverage.out

      - name: Notification Service Tests
        working-directory: apps/notification-service
        run: |
          go vet ./...
          go test -v ./... -coverprofile=coverage.out -count=1
          echo "--- Coverage Summary: notification-service ---"
          go tool cover -func=coverage.out

      - name: Admin Service Tests
        working-directory: apps/admin-service
        run: |
          go vet ./...
          go test -v ./... -coverprofile=coverage.out -count=1
          echo "--- Coverage Summary: admin-service ---"
          go tool cover -func=coverage.out

      - name: Upload Go coverage profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-reports
          path: apps/*/coverage.out
          retention-days: 14

  test-python:
    name: Python Tests (AI Service)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'apps/ai-service/uv.lock'

      # ruff is configured in pyproject.toml and nothing ran it, so 84 lint
      # violations and 15 unformatted files accumulated. Biome covers only
      # TypeScript and gofmt only Go, which left Python with a standard on
      # paper and no gate.
      - name: Python lint and format
        working-directory: apps/ai-service
        run: |
          uv run ruff check app/ tests/
          uv run ruff format --check app/ tests/

      - name: AI Service Tests
        working-directory: apps/ai-service
        run: |
          uv run pytest tests/ \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -p no:warnings
        env:
          OTEL_DISABLED: "true"
          NATS_DISABLED: "true"

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-report
          path: apps/ai-service/coverage.xml
          retention-days: 14

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Run Grype dependency scan
        uses: anchore/scan-action@v7
        with:
          path: .
          severity-cutoff: high
          fail-build: true

      # Trivy and Grype were both green while osv-scanner found 35 advisories
      # across bun.lock, go.mod and uv.lock, including four in hono, which is a
      # direct production dependency. osv-scanner prints the package count it
      # parsed per lockfile, so a parser that cannot read one shows up as a zero
      # instead of as a pass.
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.4
        with:
          scan-args: |-
            --recursive
            ./

  build-ts:
    name: Build TypeScript Services
    runs-on: ubuntu-latest
    needs: [test-unit, test-go, test-python, security-scan]
    strategy:
      matrix:
        service: [auth-service, project-service, web, admin]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build --filter=@kerjacus/${{ matrix.service }}

  build-go:
    name: Build Go Services
    runs-on: ubuntu-latest
    needs: [test-unit, test-go, test-python, security-scan]
    strategy:
      matrix:
        service: [payment-service, notification-service, admin-service]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: apps/*/go.sum

      - name: Build
        working-directory: apps/${{ matrix.service }}
        run: go build -o /dev/null ./...

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-ts, build-go]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service: payment-service
            context: apps/payment-service
          - service: notification-service
            context: apps/notification-service
          - service: admin-service
            context: apps/admin-service
          - service: project-service
            context: .
          - service: auth-service
            context: .
          - service: ai-service
            context: .
          - service: web
            context: .
          - service: admin
            context: .
    steps:
      - uses: actions/checkout@v7

      # No `if [ -f Dockerfile ]` guard: a missing Dockerfile used to make this
      # step a silent no-op that still reported success.
      - name: Build Docker image
        run: docker build -t kerjacus/${{ matrix.service }}:latest -f apps/${{ matrix.service }}/Dockerfile ${{ matrix.context }}

  # Dokploy builds the images itself from docker-compose.prod.yml, which uses
  # `build:` rather than `image:`, so there is nothing to push here. build-docker
  # is the gate: it proves every Dockerfile still builds before we ask Dokploy
  # to rebuild them on the host.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-ts, build-go, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          for name in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_COMPOSE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is unset. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

          # Compose, not application: production runs as a single Dokploy
          # Compose service (see the docker-compose.prod.yml header).
          status=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H 'accept: application/json' \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\",\"title\":\"CI ${GITHUB_SHA:0:7}\"}")

          echo "Dokploy responded $status"
          cat body.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dokploy refused the deployment (HTTP $status)."
            exit 1
          fi
