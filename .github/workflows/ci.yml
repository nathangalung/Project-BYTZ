name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the packageManager field rather than latest. Which bun runs
      # decides what bun.lock resolves to: a stale nested entry like
      # tsx/esbuild@0.27.4 survives bun update but not a fresh resolve, so a
      # floating bun can hand the security scan a tree no developer has.
      # --frozen-lockfile makes that a failure instead of a silent difference.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: TypeScript type check
        run: bun run typecheck

      # payment-service validates every escrow release against a Go copy of the
      # fee table. The copy is generated from packages/shared/src/pricing.ts, so
      # editing the rates without regenerating would leave the service enforcing
      # a margin the platform no longer charges. Runs here rather than in
      # test-go because the generator imports the TypeScript and needs Bun.
      - name: Pricing table drift check
        run: bun run apps/payment-service/scripts/generate-pricing.ts --check

      # The scoping completeness table decides the percentage that gates the
      # Generate BRD control. ai-service scores the transcript against it and
      # project-service scores the intake form against it for a floor, so a
      # keyword added on one side only would move the bar on one surface.
      - name: Completeness table drift check
        run: bun run apps/ai-service/scripts/generate-completeness.ts --check

      # Notification wording ships in two languages and is rendered twice: the
      # frontend renders in-app notifications from key plus params, and
      # notification-service renders the email body and the stored fallback in
      # the recipient's locale. Both copies are generated from
      # packages/shared/src/notification-templates.ts, so an Indonesian string
      # edited without regenerating would reach one surface and not the other.
      - name: Notification template drift check
        run: bun run apps/notification-service/scripts/generate-notification-templates.ts --check

      # The gateway routing table is one template rendered per environment. An
      # unset KC_ variable survives envsubst verbatim, so nginx reads it as one
      # of its own and refuses to start with `unknown "kc_x" variable` - in
      # whichever environment was forgotten, at deploy time. This moves that
      # failure to the build.
      - name: Gateway upstream drift check
        run: bun run scripts/check-gateway-upstreams.ts

      # The three Go services each carry a copy of the same OTLP wiring and
      # trace-context helpers. A shared module is not reachable from inside
      # their Docker build contexts, so the copies are generated instead.
      # admin-service's had already drifted before this check existed.
      - name: Go observability drift check
        run: bun run packages/go-observability/generate.ts --check

      # bun build substitutes the dotted process.env.NODE_ENV at bundle time,
      # and the Dockerfiles bundle in a stage that never sets it, so every such
      # read compiled to false and stayed false in production. That disabled
      # secure cookies, email verification and the production trustedOrigins
      # list, and folded away the guard that kept the OTP out of an API
      # response. Nothing in tsc, biome or the test suite can see it, because
      # the fault only exists in the bundle.
      - name: Runtime env read check
        run: bun run scripts/check-runtime-env.ts

      # The layering was prose until now, so nothing stopped a route reaching
      # past its repository or a service importing a route. The existing
      # route-to-db importers are named in .dependency-cruiser.cjs rather than
      # waved through, so the next one fails here.
      - name: Architecture conformance
        run: bun run arch

      # Worker.create runs webpack over src/workflows when the Temporal worker
      # starts, and nothing else here touches that path: project-service builds
      # src/index.ts and start:temporal has no job. So a bundling break passes
      # tsc, passes the build and passes every test, then stops the worker that
      # runs escrow release, team formation and dispute resolution.
      # bundleWorkflowCode needs no Temporal server, so this costs a webpack run.
      - name: Temporal workflow bundle
        run: bun run apps/project-service/scripts/check-workflow-bundle.ts

      # The workflow itself is the one file nothing checked, and it is the file
      # that decides whether anything else is checked at all. A GitHub
      # expression takes single quotes only, so `join(needs.*.result, " ")`
      # made the whole workflow unloadable: no jobs ran, and the only report
      # was "this run likely failed because of a workflow file issue" with
      # nothing naming the line. yaml.safe_load parses that file happily, so
      # local validation said it was fine. actionlint names the line.
      #
      # Pinned and run from source rather than piping a download script into
      # bash, which is the supply chain shape this repository's own scanners
      # exist to catch.
      - name: Workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      # Biome covers TypeScript only. Three Go services drifted out of gofmt
      # without anything noticing, which is what happens when near-identical
      # trees are maintained separately.
      - name: Go formatting
        run: |
          unformatted=$(gofmt -l apps/*/internal apps/*/features apps/*/main.go packages/go-observability)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

  test-unit:
    name: Unit & Integration Tests (TypeScript)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bytz_test
          POSTGRES_PASSWORD: bytz_test
          POSTGRES_DB: bytz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bytz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Valkey, matching docker-compose and prod. redis:7-alpine resolves to
      # 7.4.x under RSALv2/SSPLv1; the code targets the BSD-3 Valkey fork.
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # packages/db/src/testing.integration.test.ts hardcodes two database
      # names. It needs one of its own because project-service runs at the
      # same time under turbo and the harness truncates every table, and it
      # needs an unmigrated one to exercise the early return in truncateAll
      # (TRUNCATE with an empty table list is a syntax error, not a no-op).
      # kerjacus_accounts_test is the third: account-ownership seeds rows and
      # asserts an invariant over them, so it cannot share the database
      # project-service truncates, and its connect runs migrations, which is
      # what deadlocked against that traffic.
      # The service container above creates only POSTGRES_DB, so without this
      # those suites fail on "database does not exist". Locally the equivalent
      # is `bun run db:test:setup`, which cannot run here: it starts Postgres
      # through docker compose, and here Postgres is a service container.
      - name: Create the auxiliary test databases
        env:
          PGPASSWORD: bytz_test
        run: |
          for n in kerjacus_dbself_test kerjacus_empty_test kerjacus_accounts_test; do
            psql -h localhost -U bytz_test -d bytz_test -c "CREATE DATABASE $n"
          done

      - name: Run tests (verbose + coverage)
        # Two separators: bun run consumes the first, turbo needs the
        # second to know these belong to vitest and not to itself.
        run: bun run test:coverage -- -- --reporter verbose --reporter default
        env:
          DATABASE_URL: postgresql://bytz_test:bytz_test@localhost:5432/bytz_test
          DATABASE_DIRECT_URL: postgresql://bytz_test:bytz_test@localhost:5432/bytz_test
          # Integration suites connect here and run the migrations themselves.
          # The service above was provisioned from the start and nothing used
          # it, which is why repository and transaction tests were written as
          # regex over source text. The harness refuses any database whose name
          # does not end in _test, because it truncates every table.
          TEST_DATABASE_URL: postgresql://bytz_test:bytz_test@localhost:5432/bytz_test
          REDIS_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222
          BETTER_AUTH_SECRET: test-secret-minimum-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          NODE_ENV: test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ts-coverage-reports
          path: |
            packages/*/coverage/
            apps/*/coverage/
          retention-days: 14

  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: apps/*/go.sum

      # `go test` runs a handful of vet analyzers itself - printf, atomic,
      # errorsas and a few more - but not the rest. The ones it skips are where
      # a stale call signature surfaces, so vet runs in full here, and first:
      # it is seconds against minutes of tests, and the tests will not compile
      # past the errors it reports anyway.
      - name: Payment Service Tests
        working-directory: apps/payment-service
        run: |
          go vet ./...
          go test -v ./... -coverprofile=coverage.out -count=1
          echo "--- Coverage Summary: payment-service ---"
          go tool cover -func=coverage.out

      - name: Notification Service Tests
        working-directory: apps/notification-service
        run: |
          go vet ./...
          go test -v ./... -coverprofile=coverage.out -count=1
          echo "--- Coverage Summary: notification-service ---"
          go tool cover -func=coverage.out

      - name: Admin Service Tests
        working-directory: apps/admin-service
        run: |
          go vet ./...
          go test -v ./... -coverprofile=coverage.out -count=1
          echo "--- Coverage Summary: admin-service ---"
          go tool cover -func=coverage.out

      - name: Upload Go coverage profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-reports
          path: apps/*/coverage.out
          retention-days: 14

  test-python:
    name: Python Tests (AI Service)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'apps/ai-service/uv.lock'

      # ruff is configured in pyproject.toml and nothing ran it, so 84 lint
      # violations and 15 unformatted files accumulated. Biome covers only
      # TypeScript and gofmt only Go, which left Python with a standard on
      # paper and no gate.
      #
      # The scope is the whole directory rather than app/ and tests/. Those two
      # left main.py out, which is the file that boots the service, and it had
      # collected an unused import and seven E402s. The E402s are deliberate and
      # now carry a reason in pyproject; the import was simply dead.
      - name: Python lint and format
        working-directory: apps/ai-service
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: AI Service Tests
        working-directory: apps/ai-service
        run: |
          uv run pytest tests/ \
            -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -p no:warnings
        env:
          OTEL_DISABLED: "true"
          NATS_DISABLED: "true"

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-report
          path: apps/ai-service/coverage.xml
          retention-days: 14

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Run Grype dependency scan
        uses: anchore/scan-action@v7
        with:
          path: .
          severity-cutoff: high
          fail-build: true

      # Trivy and Grype were both green while osv-scanner found 35 advisories
      # across bun.lock, go.mod and uv.lock, including four in hono, which is a
      # direct production dependency. osv-scanner prints the package count it
      # parsed per lockfile, so a parser that cannot read one shows up as a zero
      # instead of as a pass.
      #
      # The pinned version is not incidental. osv-scanner ships govulncheck, and
      # v2.2.4 is built with Go 1.25, so once the services moved to a go 1.26
      # directive it failed with "package requires newer Go version go1.26
      # (application built with go1.25)", reported zero ecosystems and exited
      # non-zero. That reads exactly like a clean scan that then failed, which
      # is the shape this comment already warns about. Bump this alongside the
      # Go toolchain, not independently.
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

  build-ts:
    name: Build TypeScript Services
    runs-on: ubuntu-latest
    needs: [test-unit, test-go, test-python, security-scan]
    strategy:
      matrix:
        service: [auth-service, project-service, web, admin]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build --filter=@kerjacus/${{ matrix.service }}

  build-go:
    name: Build Go Services
    runs-on: ubuntu-latest
    needs: [test-unit, test-go, test-python, security-scan]
    strategy:
      matrix:
        service: [payment-service, notification-service, admin-service]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: apps/*/go.sum

      - name: Build
        working-directory: apps/${{ matrix.service }}
        run: go build -o /dev/null ./...

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-ts, build-go]
    # Runs on pull requests too, and that is the point. Gated on main only, the
    # one job that proves a Dockerfile still builds fired AFTER the merge, so a
    # broken image landed on main with a green PR behind it. That happened on
    # both #2 and #3: PR green, merge commit red.
    strategy:
      # One broken image used to cancel the other seven, so a single Dockerfile
      # fault was indistinguishable from all of them being broken.
      fail-fast: false
      matrix:
        include:
          - service: payment-service
            context: apps/payment-service
          - service: notification-service
            context: apps/notification-service
          - service: admin-service
            context: apps/admin-service
          - service: project-service
            context: .
          - service: auth-service
            context: .
          - service: ai-service
            context: .
          - service: web
            context: .
          - service: admin
            context: .
    steps:
      - uses: actions/checkout@v7

      # No `if [ -f Dockerfile ]` guard: a missing Dockerfile used to make this
      # step a silent no-op that still reported success.
      - name: Build Docker image
        run: docker build -t kerjacus/${{ matrix.service }}:latest -f apps/${{ matrix.service }}/Dockerfile ${{ matrix.context }}

  # Dokploy builds the images itself from docker-compose.prod.yml, which uses
  # `build:` rather than `image:`, so there is nothing to push here. build-docker
  # is the gate: it proves every Dockerfile still builds before we ask Dokploy
  # to rebuild them on the host.
  #
  # One check to require, instead of eight matrix legs by name.
  #
  # Branch protection matches required checks by their rendered name, and a
  # matrix renders one per leg ("Build Docker Images (web, .)"), so requiring
  # the images directly means listing eight strings that change whenever the
  # matrix does, and a renamed leg silently stops being required. This job
  # depends on everything and reports a single stable name.
  #
  # `always()` matters: without it a failed upstream leaves this skipped, and a
  # required check that never runs blocks the pull request for ever rather than
  # failing it.
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-and-typecheck
      - test-unit
      - test-go
      - test-python
      - security-scan
      - build-ts
      - build-go
      - build-docker
    steps:
      - name: Require every upstream job to have succeeded
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "upstream results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job reported '$result'"
              exit 1
            fi
          done
          echo "every required job succeeded"

  # Whether this repository can deploy at all.
  #
  # The `secrets` context is not available in a job-level `if`, so the question
  # is answered in a step and published as an output. It exists so the deploy
  # below reports "skipped" rather than "failed" when the three credentials are
  # absent: a failing step would paint main red on every push for a condition no
  # commit can fix, and a gate that is always red stops being read. Skipped says
  # the same thing without that cost, and the deploy turns itself on the moment
  # the secrets are added.
  deploy-configured:
    name: Deploy credentials
    runs-on: ubuntu-latest
    needs: [build-ts, build-go, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_COMPOSE_ID; do
            # An if, not `test && assign`: under `set -e` a false test is a
            # non-zero status and aborts the step.
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Deploy skipped. Unset:$missing. Add them under" \
                 "Settings > Secrets and variables > Actions, then turn off" \
                 "Dokploy's own auto-deploy so this job is the only trigger."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [deploy-configured]
    if: needs.deploy-configured.outputs.ready == 'true'
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail

          # Compose, not application: production runs as a single Dokploy
          # Compose service (see the docker-compose.prod.yml header).
          status=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H 'accept: application/json' \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\",\"title\":\"CI ${GITHUB_SHA:0:7}\"}")

          echo "Dokploy responded $status"
          cat body.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dokploy refused the deployment (HTTP $status)."
            exit 1
          fi
