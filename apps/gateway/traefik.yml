api:
  dashboard: true
  insecure: true

# Required by the `traefik healthcheck` command used as the container
# healthcheck; without it the check always fails even though Traefik is fine.
ping:
  entryPoint: web

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO

accessLog: {}
