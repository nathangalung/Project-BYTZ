[gateway]
bind_address = "0.0.0.0:3333"

# Models (Google AI Studio / Gemini)

# Tracked alias, not a pinned version. Three models
# configured here have been retired: text-embedding-004,
# gemini-2.5-pro-preview-06-05 and gemini-2.5-flash.
# Each failure was silent, so the alias is the safer trade.

[models.gemini-flash]
routing = ["gemini-flash-google"]

[models.gemini-flash.providers.gemini-flash-google]
type = "google_ai_studio_gemini"
model_name = "gemini-flash-latest"

# Functions

[functions.chatbot]
type = "chat"

[functions.chatbot.variants.production]
type = "chat_completion"
model = "gemini-flash"
temperature = 0.7
max_tokens = 2048

[functions.brd_generation]
type = "json"

[functions.brd_generation.variants.production]
type = "chat_completion"
model = "gemini-flash"
json_mode = "on"
temperature = 0.3
max_tokens = 8192

[functions.prd_generation]
type = "json"

[functions.prd_generation.variants.production]
type = "chat_completion"
model = "gemini-flash"
json_mode = "on"
temperature = 0.3
max_tokens = 16384

[functions.cv_extraction]
type = "json"

[functions.cv_extraction.variants.production]
type = "chat_completion"
model = "gemini-flash"
json_mode = "on"
temperature = 0.1
max_tokens = 4096

[functions.matching_rerank]
type = "json"

[functions.matching_rerank.variants.gemini_flash]
type = "chat_completion"
model = "gemini-flash"
json_mode = "on"
temperature = 0.2
max_tokens = 1024
