resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Restore the real client address.
    #
    # This container's peer is the Dokploy proxy, so $remote_addr is an
    # internal address and every visitor looked identical to anything keying
    # on it. The rate limiter keyed on exactly that and gave the whole
    # platform one shared bucket of ten logins a minute.
    #
    # Cloudflare writes CF-Connecting-IP once, at the edge, with the real
    # client. Trusting it is only sound while Cloudflare is the sole ingress:
    # a request that reaches the origin directly can set the header itself, so
    # the origin firewall has to reject anything that is not Cloudflare.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # API proxy — same-origin, no CORS needed, cookies work automatically
    location /api/ {
        set $gateway http://api-gateway:80;
        proxy_pass $gateway;
        proxy_set_header Host api.kerjacus.id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
