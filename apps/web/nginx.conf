resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Restore the real client address.
    #
    # This container's peer is the Dokploy proxy, so $remote_addr is an
    # internal address and every visitor looked identical to anything keying
    # on it. The rate limiter keyed on exactly that and gave the whole
    # platform one shared bucket of ten logins a minute.
    #
    # Cloudflare writes CF-Connecting-IP once, at the edge, with the real
    # client. Trusting it is only sound while Cloudflare is the sole ingress:
    # a request that reaches the origin directly can set the header itself, so
    # the origin firewall has to reject anything that is not Cloudflare.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # API proxy — same-origin, no CORS needed, cookies work automatically
    location /api/ {
        set $gateway http://api-gateway:80;
        proxy_pass $gateway;
        proxy_set_header Host api.kerjacus.id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets.
    # add_header does not merge: a location that declares any add_header drops
    # every header inherited from the server block. So the security headers are
    # repeated here rather than assumed.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Security headers.
    # X-XSS-Protection is gone on purpose: every current browser ignores it,
    # and the one behaviour it did have (selective script blocking) introduced
    # its own vulnerabilities, which is why Chrome removed the auditor.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # TLS terminates at Cloudflare and again at Dokploy's Traefik, so this is
    # about the browser refusing plaintext on later visits, not about this hop.
    # No preload: that is a one-way submission and covers every subdomain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP. 'unsafe-inline' on style-src is required by the Tailwind runtime and
    # by React inline styles for progress widths and per-talent colours; script
    # keeps no such exception, so an inline <script> still does not execute.
    # connect-src carries the API origin and the Centrifugo websocket.
    # frame-ancestors repeats X-Frame-Options for browsers that honour only the
    # CSP form.
    #
    # Midtrans is named because checkout loads snap.js from their origin at
    # runtime and then opens their payment window in an iframe. Under
    # `script-src 'self'` that script was refused outright - verified in a
    # browser against this exact header: "Loading the script
    # 'https://app.sandbox.midtrans.com/snap/snap.js' violates the following
    # Content Security Policy directive: script-src 'self'". window.snap then
    # never exists, the Pay button stays disabled behind `snapReady`, and no
    # escrow, BRD or PRD can be paid for at all. Both hosts are listed because
    # the same image serves every environment and MIDTRANS_IS_SANDBOX picks the
    # host at runtime; naming one would break the other. Nothing else is
    # widened - no other origin, and no 'unsafe-inline'.
    #
    # The one sha256 covers the anti-FOUC theme script in index.html, which
    # reads the stored theme and sets the dark class before first paint. Under
    # a bare `script-src 'self'` the browser refused it, so every dark-mode
    # visitor got a white flash on every page load - measured on the live site
    # with the app bundle blocked: html carried no class and body painted
    # rgb(250, 250, 247). A hash, not 'unsafe-inline': that would admit every
    # inline script rather than this one. The hash is over the exact bytes
    # between the tags, so reformatting the block silently breaks it with no
    # error anywhere; csp.test.ts recomputes it from index.html and fails when
    # the two drift.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-lkw6Xh1vXC4GE3zMOhtXn/tZ+Z8Q7Gjx8gO3dHqGGYw=' https://app.midtrans.com https://app.sandbox.midtrans.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://api.kerjacus.id https://app.midtrans.com https://app.sandbox.midtrans.com https://snap-assets.midtrans.com https://snap-assets.sandbox.midtrans.com; connect-src 'self' https://api.kerjacus.id wss://api.kerjacus.id https://app.midtrans.com https://app.sandbox.midtrans.com https://api.midtrans.com https://api.sandbox.midtrans.com; frame-src 'self' https://app.midtrans.com https://app.sandbox.midtrans.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
