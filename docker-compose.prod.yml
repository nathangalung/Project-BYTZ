
# KerjaCUS! Full Production Stack
# Deploy via Dokploy as a Compose service
#
# Memory ceiling: 3.44 GB across 23 services - the SUM OF LIMITS, not expected
# usage, which runs well under. Was ~4.2 GB before SigNoz + ClickHouse +
# Langfuse came out, OpenObserve went in, and Flagsmith was dropped as unused.
#
# Secrets marked ${VAR:?...} abort `docker compose up` when unset rather than
# interpolating to an empty string. That matters most for OPENOBSERVE_OTLP_TOKEN:
# empty sends the header "Authorization: Basic " and OpenObserve 401s every span
# without the services ever noticing.

services:
  # DATABASES & INFRASTRUCTURE
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER:-kerjacus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-kerjacus}
    volumes:
      - kerjacus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kerjacus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  pgbouncer:
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-kerjacus}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: plain
      CLIENT_TLS_SSLMODE: disable
      SERVER_TLS_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M

  # Valkey, not Redis - see docker-compose.yml for the licence rationale.
  valkey:
    image: valkey/valkey:9-alpine
    command: valkey-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - kerjacus_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - kerjacus_nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  nats-init:
    image: natsio/nats-box@sha256:ffce8bd103383f179f8c7f11cf645726acf5d17280706c530c3b342dbe16334c
    entrypoint: ["/bin/sh", "/scripts/nats-init-streams.sh"]
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./apps/gateway/nats-init-streams.sh:/scripts/nats-init-streams.sh:ro
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 32M

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      # Unset, MinIO falls back to minioadmin/minioadmin.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - kerjacus_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # Nothing created the bucket, so every presigned PUT hit NoSuchBucket.
  # Private except avatar/, which the browser loads in an img tag. CVs,
  # dispute evidence and deliverables are read through presigned GET.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: >
      /bin/sh -c "
      mc alias set kerjacus http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing kerjacus/kerjacus-uploads &&
      mc anonymous set none kerjacus/kerjacus-uploads &&
      mc anonymous set download kerjacus/kerjacus-uploads/avatar
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 32M

  # REAL-TIME & AI GATEWAY
  centrifugo:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile.centrifugo
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: kerjacus/centrifugo:latest
    command: centrifugo -c /centrifugo.json
    environment:
      # v6 env names. The v5 names (CENTRIFUGO_API_KEY /
      # CENTRIFUGO_TOKEN_HMAC_SECRET_KEY) are silently ignored by v6, which
      # would have left the baked-in "changeme-overridden-by-env" placeholders
      # live in production. Verified against `centrifugo defaultenv`.
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET:?CENTRIFUGO_SECRET is required}
    # health.enabled is already true in centrifugo-prod.json, so /health on the
    # client port answers {} with 200. wget lives at /usr/bin/wget in the v6.9.1
    # image (busybox applet) - verified by running it, because /bin carries no
    # wget symlink and the obvious CMD would have failed every check.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  # WORKFLOW ORCHESTRATION (Temporal)
  temporal-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD is required}
      POSTGRES_DB: temporal
    volumes:
      - kerjacus_temporal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  temporal:
    image: temporalio/auto-setup@sha256:9be7b8d98f60d00f4f2ff74731c071a17848d8182bbc8429e314a24c94ea105b
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD is required}
      POSTGRES_SEEDS: temporal-db
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamic-config.yaml
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
      DEFAULT_NAMESPACE: kerjacus
      SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: "true"
    volumes:
      - ./apps/gateway/temporal-dynamic-config.yaml:/etc/temporal/dynamic-config.yaml:ro
    depends_on:
      temporal-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  temporal-ui:
    image: temporalio/ui:2.52.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: https://temporal.kerjacus.id
    depends_on:
      - temporal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  openobserve:
    image: openobserve/openobserve:v0.91.2
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:?OPENOBSERVE_USER is required}
      # Must be 8-128 chars with upper, lower, digit and symbol or it panics
      # at startup rather than warning, so empty is not a usable default.
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:?OPENOBSERVE_PASSWORD is required - 8-128 chars with upper, lower, digit and symbol}
      ZO_DATA_DIR: /data
      # Caches size from HOST memory, not the cgroup limit - must be explicit
      # or it reserves multiple GB and the memory limit below OOM-kills it.
      ZO_MEMORY_CACHE_MAX_SIZE: "128"
      ZO_DISK_CACHE_MAX_SIZE: "2048"
      ZO_TELEMETRY: "false"
    volumes:
      - kerjacus_openobserve_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kerjacus-o2.rule=Host(`observe.kerjacus.id`)"
      - "traefik.http.routers.kerjacus-o2.entrypoints=websecure"
      - "traefik.http.routers.kerjacus-o2.tls.certresolver=letsencrypt"
      - "traefik.http.services.kerjacus-o2.loadbalancer.server.port=5080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # MONITORING
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - kerjacus_uptime_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kerjacus-uptime.rule=Host(`status.kerjacus.id`)"
      - "traefik.http.routers.kerjacus-uptime.entrypoints=websecure"
      - "traefik.http.routers.kerjacus-uptime.tls.certresolver=letsencrypt"
      - "traefik.http.services.kerjacus-uptime.loadbalancer.server.port=3001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

  # Migrate schema before services start.
  # Fresh volume otherwise 500s queries.
  # Idempotent, safe to rerun.
  db-migrate:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: ["sh", "-c", "cd /app/packages/db && bun run db:migrate"]
    environment:
      # Direct session, pgbouncer breaks DDL.
      DATABASE_DIRECT_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-kerjacus}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # APPLICATION SERVICES
  #
  # Every app container probes /health, the LIVENESS route, and never
  # /health/ready. The readiness routes check the database (and, on ai-service,
  # that an API key is present), so a pgbouncer blip or a Postgres failover
  # would mark every container unhealthy at once and Dokploy would pull the
  # whole platform out of rotation over a dependency the containers cannot fix
  # by restarting. Liveness answers the only question a container healthcheck
  # can act on: is this process still serving. Readiness stays where it is
  # useful, for uptime-kuma and for a human.
  #
  # start_period is the grace window before a failure counts, not a delay - a
  # container that answers sooner is marked healthy sooner.
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@pgbouncer:5432/${DB_NAME:-kerjacus}?sslmode=disable
      DATABASE_DIRECT_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-kerjacus}?sslmode=disable
      REDIS_URL: redis://valkey:6379
      NATS_URL: nats://nats:4222
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: https://kerjacus.id
      # Unguarded on purpose: lib/auth.ts registers the Google provider only
      # when both are set, so an unset pair disables social sign-in rather
      # than breaking it silently. Same for the Zenziva pair below, which
      # lib/sms.ts reports as an explicit error to the caller.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CORS_ORIGIN: https://kerjacus.id
      NODE_ENV: production
      ZENZIVA_USER_KEY: ${ZENZIVA_USER_KEY}
      ZENZIVA_API_KEY: ${ZENZIVA_API_KEY}
      # Verification and password recovery are sent from here, not from
      # notification-service. Without these two the reset endpoint answers
      # normally and no mail is ever sent, which the identical anti-enumeration
      # response makes indistinguishable from success. Guarded like
      # DB_PASSWORD: a deploy that forgets the key must fail at the deploy,
      # not months later in a support ticket about a reset link nobody got.
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM: ${EMAIL_FROM}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  project-service:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@pgbouncer:5432/${DB_NAME:-kerjacus}?sslmode=disable
      DATABASE_DIRECT_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-kerjacus}?sslmode=disable
      REDIS_URL: redis://valkey:6379
      NATS_URL: nats://nats:4222
      AI_SERVICE_URL: http://ai-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      CORS_ORIGIN: https://kerjacus.id
      AUTH_SERVICE_URL: http://auth-service:3001
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic ${OPENOBSERVE_OTLP_TOKEN:?OPENOBSERVE_OTLP_TOKEN is required - an empty value sends "Basic " and OpenObserve 401s every span silently}
      TEMPORAL_URL: temporal:7233
      TEMPORAL_NAMESPACE: kerjacus
      # Signs Centrifugo subscription tokens for chat, project and milestone.
      CENTRIFUGO_SECRET: ${CENTRIFUGO_SECRET:?CENTRIFUGO_SECRET is required}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://api.kerjacus.id/storage}
      S3_BUCKET: kerjacus-uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      NODE_ENV: production
    # bun and not wget: this service's runner stage is oven/bun:1.3-slim, which
    # is Debian and carries neither wget nor curl, unlike the alpine runner
    # auth-service uses. A wget probe here would exit 127 on every interval and
    # mark a working container unhealthy. fetch resolves, !r.ok covers any
    # non-2xx, and a refused connection throws and exits non-zero - all three
    # checked against this image.
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3002/health'); if (!r.ok) process.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      nats:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 160M

  # Runs workflows project-service only starts.
  # Memory 448M: measured RSS ~350M.
  #
  # No healthcheck, deliberately. src/workers/temporal-worker.ts builds a
  # Temporal Worker and nothing else - it opens no HTTP listener and binds no
  # port, so there is neither an endpoint to probe nor a socket to connect to.
  # A TCP check would have nothing to connect to and an invented /health would
  # 404 and mark a working worker unhealthy. Its liveness is visible in
  # Temporal: a worker that stops polling drops out of the task queue's poller
  # list. Giving it a real probe means adding a listener to the worker, which
  # is application code and belongs in its own change.
  project-worker:
    build:
      context: .
      dockerfile: apps/project-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    command: ["bun", "run", "src/workers/temporal-worker.ts"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@pgbouncer:5432/${DB_NAME:-kerjacus}?sslmode=disable
      DATABASE_DIRECT_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-kerjacus}?sslmode=disable
      REDIS_URL: redis://valkey:6379
      NATS_URL: nats://nats:4222
      AI_SERVICE_URL: http://ai-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      CORS_ORIGIN: https://kerjacus.id
      AUTH_SERVICE_URL: http://auth-service:3001
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic ${OPENOBSERVE_OTLP_TOKEN:?OPENOBSERVE_OTLP_TOKEN is required - an empty value sends "Basic " and OpenObserve 401s every span silently}
      TEMPORAL_URL: temporal:7233
      TEMPORAL_NAMESPACE: kerjacus
      TEMPORAL_TASK_QUEUE: project-service
      # The worker signs no subscription tokens, but it validates the same
      # projectEnvSchema as project-service, and that schema now requires this
      # rather than defaulting it. Omitting it here stops the worker at boot.
      CENTRIFUGO_SECRET: ${CENTRIFUGO_SECRET:?CENTRIFUGO_SECRET is required}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://api.kerjacus.id/storage}
      S3_BUCKET: kerjacus-uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      NODE_ENV: production
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      nats:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 448M

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-kerjacus}?sslmode=disable
      # Publishes ai.* events and consumes embed requests.
      NATS_URL: nats://nats:4222
      # Nothing in app/ reads this yet - the service has no embedding or RAG
      # cache, so every repeated parse-cv and every repeated embedding is paid
      # for at OpenRouter twice. Wired here so the cache lands as a code change
      # against a valkey that is already addressable, rather than as a code
      # change plus a deploy-time env change. Same instance the auth,
      # project and notification services use; note its 64mb allkeys-lru
      # eviction before storing anything that must not disappear.
      REDIS_URL: redis://valkey:6379
      # One key for both models through OpenRouter: z-ai/glm-5.3 for chat, BRD,
      # PRD and CV parsing, voyageai/voyage-4-large for embeddings. Required
      # rather than optional, because without it the service starts, answers
      # /health, and fails /ready forever while looking deployed.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required - the service starts without it but every model call and the readiness probe fail}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
      # parse-cv rejects a file_url whose host is not one of these. Unset, it
      # defaulted to localhost:9000 and every CV download hit the container
      # itself, so parsing returned empty with confidence 0.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://api.kerjacus.id/storage}
      S3_BUCKET: kerjacus-uploads
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic ${OPENOBSERVE_OTLP_TOKEN:?OPENOBSERVE_OTLP_TOKEN is required - an empty value sends "Basic " and OpenObserve 401s every span silently}
    # python:3.13-slim-trixie ships neither wget nor curl - only
    # /usr/local/bin/python3 - so the probe is urllib. app/routes/health.py is
    # mounted with no prefix, so the route is /health and not /health/ready or
    # /api/v1/ai/health. urlopen raises on a non-2xx, which exits non-zero.
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # The uv-built venv imports the OTel instrumentation and the model client
      # before uvicorn binds, which is the slowest boot in the stack.
      start_period: 90s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  payment-service:
    build:
      context: ./apps/payment-service
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      # default_query_exec_mode=exec: pgbouncer above runs POOL_MODE
      # transaction, so a connection is handed to a different client between
      # statements. pgx v5 defaults to cache_statement, which PREPAREs a
      # statement on one backend and EXECUTEs it on whatever backend the next
      # transaction lands on - "prepared statement \"stmtcache_...\" does not
      # exist", intermittently, under load only. exec sends the query and its
      # parameters together with no server-side statement to lose. Only the
      # three Go services carry this: it is a pgx DSN parameter, and the
      # TypeScript services reach the same pgbouncer through postgres.js, which
      # would forward an unknown parameter to the server as a startup option
      # and fail to connect at all.
      DATABASE_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@pgbouncer:5432/${DB_NAME:-kerjacus}?sslmode=disable&default_query_exec_mode=exec
      # internal/observability/otel.go defaulted this to http://localhost:4318,
      # so all three Go services exported every span and metric into their own
      # container and OpenObserve held nothing from them. Same endpoint the
      # TypeScript services use; the SDK appends /v1/traces and /v1/metrics.
      # No OTEL_EXPORTER_OTLP_PROTOCOL: otel.go imports the http/protobuf
      # exporters directly and never reads it.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic ${OPENOBSERVE_OTLP_TOKEN:?OPENOBSERVE_OTLP_TOKEN is required - an empty value sends "Basic " and OpenObserve 401s every span silently}
      DEPLOYMENT_ENV: production
      SERVICE_VERSION: ${GIT_SHA:-unknown}
      # The Go runtime sizes its heap from the machine, not the cgroup, so the
      # 48M limit below was invisible to it: the GC waited for a heap target it
      # would never be allowed to reach and the kernel OOM-killed the container
      # first. An OOM kill here drops an in-flight Midtrans notification.
      # GOMEMLIMIT is a soft ceiling over the whole runtime footprint, not just
      # the heap, so it is set below the hard limit - the ~8MiB of headroom
      # covers the binary's mappings and the allocations the runtime makes
      # outside its accounting. Keep the two in step if the limit changes.
      GOMEMLIMIT: 40MiB
      # No cpus limit is set on any service in this file, so without this the
      # runtime reads the host's full core count and sizes per-P caches, GC
      # workers and the scheduler for cores this container will never have to
      # itself. 2 is a deliberate cap to bound that overhead under a 48MiB
      # ceiling, not a mirror of a quota - these services block on Postgres and
      # NATS rather than on CPU, and blocking syscalls do not hold a P.
      GOMAXPROCS: "2"
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:?MIDTRANS_SERVER_KEY is required}
      # config.go reads MIDTRANS_IS_SANDBOX, never MIDTRANS_SNAP_URL, and
      # defaults to sandbox when unset. Left unset, production took no real
      # payments. No default here: the operator has to choose.
      MIDTRANS_IS_SANDBOX: ${MIDTRANS_IS_SANDBOX:?set "false" for live payments or "true" for sandbox}
      # Payouts (Iris) key, issued separately from the acquiring keys. Optional:
      # empty leaves payout-account validation inert, changing nothing.
      IRIS_API_KEY: ${IRIS_API_KEY:-}
      # Arms real payouts. Off by default; requires a funded Iris balance.
      DISBURSEMENT_ENABLED: ${DISBURSEMENT_ENABLED:-false}
      IRIS_APPROVER_OTP: ${IRIS_APPROVER_OTP:-}
      AUTH_SERVICE_URL: http://auth-service:3001
      PROJECT_SERVICE_URL: http://project-service:3002
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
      CORS_ORIGIN: https://kerjacus.id
      # The outbox publisher drains payment_events to NATS. Unset, cfg.NATSURL
      # defaults to localhost and every payment.* event is lost in production.
      NATS_URL: nats://nats:4222
      PORT: "3004"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      nats:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 48M

  notification-service:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      # See payment-service for why exec, and why only the Go services get it.
      DATABASE_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@pgbouncer:5432/${DB_NAME:-kerjacus}?sslmode=disable&default_query_exec_mode=exec
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic ${OPENOBSERVE_OTLP_TOKEN:?OPENOBSERVE_OTLP_TOKEN is required - an empty value sends "Basic " and OpenObserve 401s every span silently}
      DEPLOYMENT_ENV: production
      SERVICE_VERSION: ${GIT_SHA:-unknown}
      # See payment-service. Same 48M limit, same pair of values.
      GOMEMLIMIT: 40MiB
      GOMAXPROCS: "2"
      NATS_URL: nats://nats:4222
      # Consumer idempotency keys live in Valkey. Unset, newIdempotency falls
      # back to NoOp and a redelivered NATS event sends the email twice.
      REDIS_URL: redis://valkey:6379
      # Every notification that names an email channel fails without it, and
      # each one costs three deliveries and a dead letter row before anyone
      # sees why. Required at deploy time, like DB_PASSWORD.
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM: ${EMAIL_FROM}
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_SECRET:?CENTRIFUGO_SECRET is required}
      AUTH_SERVICE_URL: http://auth-service:3001
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
      PORT: "3005"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 48M

  admin-service:
    build:
      context: ./apps/admin-service
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      # See payment-service for why exec, and why only the Go services get it.
      DATABASE_URL: postgresql://${DB_USER:-kerjacus}:${DB_PASSWORD:?DB_PASSWORD is required}@pgbouncer:5432/${DB_NAME:-kerjacus}?sslmode=disable&default_query_exec_mode=exec
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic ${OPENOBSERVE_OTLP_TOKEN:?OPENOBSERVE_OTLP_TOKEN is required - an empty value sends "Basic " and OpenObserve 401s every span silently}
      DEPLOYMENT_ENV: production
      SERVICE_VERSION: ${GIT_SHA:-unknown}
      # See payment-service. Same 48M limit, same pair of values.
      GOMEMLIMIT: 40MiB
      GOMAXPROCS: "2"
      AUTH_SERVICE_URL: http://auth-service:3001
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:?SERVICE_AUTH_SECRET is required}
      CORS_ORIGIN: https://admin.kerjacus.id
      # The DLQ reprocess endpoint republishes failed events to NATS. Unset,
      # cfg.NATSURL defaults to localhost and reprocessing always fails.
      NATS_URL: nats://nats:4222
      PORT: "3006"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3006/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      nats:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 48M

  # FRONTENDS
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ""
        VITE_APP_URL: https://kerjacus.id
        # Guarded like the server key it pairs with: baked into the bundle at
        # build time, so an unset one ships a checkout that cannot open Snap
        # and a build that reported success.
        VITE_MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:?MIDTRANS_CLIENT_KEY is required}
        # snap.js host must match the payment service. Tokens do not cross.
        VITE_MIDTRANS_IS_SANDBOX: ${MIDTRANS_IS_SANDBOX:?set "false" for live payments or "true" for sandbox}
        VITE_CENTRIFUGO_URL: ${VITE_CENTRIFUGO_URL:-wss://api.kerjacus.id/centrifugo/connection/websocket}
        GIT_SHA: ${GIT_SHA:-unknown}
    # The runner is nginx serving a built SPA, so / is the only route there is
    # and it is a file read. No API call, so a backend outage cannot mark the
    # frontend unhealthy and take the marketing site down with it.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kerjacus-web.rule=Host(`kerjacus.id`) || Host(`www.kerjacus.id`)"
      - "traefik.http.routers.kerjacus-web.entrypoints=websecure"
      - "traefik.http.routers.kerjacus-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.kerjacus-web.loadbalancer.server.port=80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ""
        VITE_APP_URL: https://admin.kerjacus.id
        GIT_SHA: ${GIT_SHA:-unknown}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kerjacus-admin.rule=Host(`admin.kerjacus.id`)"
      - "traefik.http.routers.kerjacus-admin.entrypoints=websecure"
      - "traefik.http.routers.kerjacus-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.kerjacus-admin.loadbalancer.server.port=80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M

  # API GATEWAY
  api-gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile.api-gateway
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: kerjacus/api-gateway:latest
    # Upstreams are injected, not baked in, so development renders the same
    # routing table against host.docker.internal instead of container DNS.
    environment:
      KC_AUTH_UPSTREAM: auth-service:3001
      KC_PROJECT_UPSTREAM: project-service:3002
      KC_AI_UPSTREAM: ai-service:3003
      KC_PAYMENT_UPSTREAM: payment-service:3004
      KC_NOTIFICATION_UPSTREAM: notification-service:3005
      KC_ADMIN_UPSTREAM: admin-service:3006
      KC_CENTRIFUGO_UPSTREAM: centrifugo:8000
      KC_MINIO_UPSTREAM: minio:9000
    # location /health returns a literal 200 from nginx itself, so this checks
    # that the rendered routing table loaded, not that any upstream is up. A
    # single failing service must not take the whole edge out of rotation.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kerjacus-api.rule=Host(`api.kerjacus.id`)"
      - "traefik.http.routers.kerjacus-api.entrypoints=websecure"
      - "traefik.http.routers.kerjacus-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.kerjacus-api.loadbalancer.server.port=80"
    depends_on:
      - auth-service
      - project-service
      - ai-service
      - payment-service
      - notification-service
      - admin-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 16M before the rate limiter. limit_req_zone mmaps its shared memory
          # up front and it counts against the cgroup: two 2m zones on top of
          # nginx's own working set left no headroom, and a zone allocation
          # that gets OOM-killed takes the edge down rather than degrading.
          memory: 32M

volumes:
  kerjacus_pg_data:
  kerjacus_valkey_data:
  kerjacus_nats_data:
  kerjacus_minio_data:
  kerjacus_temporal_db:
  kerjacus_openobserve_data:
  kerjacus_uptime_data:

networks:
  default:
    external: true
    name: dokploy-network
